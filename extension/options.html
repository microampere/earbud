<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Earbud Settings</title>
  <style>
    :root {
      --bg: #0f172a; --surface: #1e293b; --border: #334155;
      --text: #e2e8f0; --dim: #64748b; --blue: #60a5fa; --green: #4ade80;
      --radius: 6px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px; padding: 32px; max-width: 480px;
    }
    h1 { font-size: 18px; margin-bottom: 24px; }
    h1 span { color: var(--blue); }
    label {
      display: block; color: var(--dim); font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px;
    }
    input, select {
      width: 100%; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text); font-size: 14px;
      padding: 8px 12px; outline: none; margin-bottom: 20px;
      transition: border-color 0.15s; font-family: inherit;
    }
    input:focus, select:focus { border-color: var(--blue); }
    select { appearance: none; cursor: pointer; }
    .hint { color: var(--dim); font-size: 12px; margin-top: -16px; margin-bottom: 20px; }
    button {
      background: var(--blue); border: none; border-radius: var(--radius);
      color: #0f172a; cursor: pointer; font-size: 14px; font-weight: 600;
      padding: 10px 24px; transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
    #saved-msg { color: var(--green); font-size: 13px; margin-left: 12px; opacity: 0; transition: opacity 0.3s; }
    #saved-msg.visible { opacity: 1; }
    a { color: var(--blue); text-decoration: none; font-size: 12px; }
    a:hover { text-decoration: underline; }
    .footer { margin-top: 32px; color: var(--dim); font-size: 12px; }
  </style>
</head>
<body>
  <h1>earbud <span>settings</span></h1>

  <label for="api-key">Anthropic API Key</label>
  <input type="password" id="api-key" placeholder="sk-ant-..." autocomplete="off" />
  <p class="hint">Get your key at <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a></p>

  <label for="model">Model</label>
  <select id="model">
    <option value="claude-haiku-4-5-20251001">claude-haiku-4-5 — fast &amp; cheap (recommended)</option>
    <option value="claude-sonnet-4-6">claude-sonnet-4-6 — more nuanced questions</option>
  </select>

  <div style="display:flex;align-items:center">
    <button id="save-btn">Save</button>
    <span id="saved-msg">Saved ✓</span>
  </div>

  <p class="footer">
    API key is stored locally in your browser and never leaves your device.
  </p>

  <script src="options.js"></script>
</body>
</html>
