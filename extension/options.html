<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Earbud Settings</title>
  <style>
    :root {
      --bg: #0f172a; --surface: #1e293b; --border: #334155;
      --text: #e2e8f0; --dim: #64748b; --blue: #60a5fa; --green: #4ade80;
      --amber: #fbbf24; --radius: 6px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px; padding: 32px; max-width: 480px;
    }
    h1 { font-size: 18px; margin-bottom: 24px; }
    h1 span { color: var(--blue); }
    .field { margin-bottom: 20px; }
    label {
      display: block; color: var(--dim); font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px;
    }
    .free-badge {
      display: inline-block; background: var(--amber); color: #0f172a;
      font-size: 10px; font-weight: 700; padding: 1px 5px;
      border-radius: 3px; margin-left: 6px; vertical-align: middle;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    input, select {
      width: 100%; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text); font-size: 14px;
      padding: 8px 12px; outline: none; transition: border-color 0.15s;
      font-family: inherit;
    }
    input:focus, select:focus { border-color: var(--blue); }
    select { appearance: none; cursor: pointer; }
    .hint { color: var(--dim); font-size: 12px; margin-top: 5px; }
    .hint a { color: var(--blue); text-decoration: none; }
    .hint a:hover { text-decoration: underline; }
    .actions { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
    button {
      background: var(--blue); border: none; border-radius: var(--radius);
      color: #0f172a; cursor: pointer; font-size: 14px; font-weight: 600;
      padding: 10px 24px; transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
    #saved-msg { color: var(--green); font-size: 13px; opacity: 0; transition: opacity 0.3s; }
    #saved-msg.visible { opacity: 1; }
    .footer { margin-top: 32px; color: var(--dim); font-size: 12px; line-height: 1.6; }
    .toggle-row { display: flex; align-items: center; gap: 10px; }
    .toggle-label { font-size: 14px; color: var(--text); }
    .toggle-btn {
      background: var(--surface); border: 1px solid var(--border); border-radius: 99px;
      color: var(--dim); cursor: pointer; font-size: 12px; font-weight: 600;
      padding: 3px 14px; transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .toggle-btn[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: #0f172a; }
    hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
  </style>
</head>
<body>
  <h1>earbud <span>settings</span></h1>

  <div class="field">
    <label for="provider">AI Provider</label>
    <select id="provider">
      <option value="anthropic">Anthropic Claude</option>
      <option value="gemini">Google Gemini ✦ free tier</option>
      <option value="ollama">Ollama ✦ local</option>
    </select>
  </div>

  <div class="field" id="ollama-url-field" style="display:none">
    <label for="ollama-url">Ollama URL</label>
    <input type="text" id="ollama-url" placeholder="http://localhost:11434" autocomplete="off" />
    <p class="hint">Base URL of your Ollama server. Default: http://localhost:11434</p>
  </div>

  <div class="field" id="api-key-field">
    <label for="api-key" id="key-label">API Key</label>
    <input type="password" id="api-key" autocomplete="off" />
    <p class="hint" id="key-hint"></p>
  </div>

  <div class="field">
    <label for="model">Model</label>
    <select id="model"></select>
  </div>

  <hr />

  <div class="field">
    <label>Developer</label>
    <div class="toggle-row">
      <span class="toggle-label">Debug log</span>
      <button type="button" id="debug-toggle" class="toggle-btn" aria-pressed="false">Off</button>
    </div>
    <p class="hint">Shows a live debug log in the sidebar. Leave off in normal use.</p>
  </div>

  <hr />

  <div class="actions">
    <button id="save-btn">Save</button>
    <span id="saved-msg">Saved ✓</span>
  </div>

  <p class="footer">
    API keys are stored locally in your browser and never leave your device.
  </p>

  <script src="options.js"></script>
</body>
</html>
